name: La Forja build check
on:
  push:
    paths:
      - 'la-forja-src/**'
      - '.github/workflows/la-forja-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: la-forja-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: la-forja-src/package.json
      - run: npm install
      - run: npm run build
